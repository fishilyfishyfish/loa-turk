<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOA 튀르크</title>
<style>
/* Layout: the engine's speech bubble, the board, and the side picker or one button, stacked in the middle */
:root {
  --bg: #e8ebe5;
  --ink: #16191b;
  --line: #c6ccc3;
  --surface: #f7f8f4;
  --muted: #5a625d;
  --sq-light: #d5d9cf;
  --sq-dark: #98a395;
  --accent: #2346c8;
  --accent-soft: rgba(35, 70, 200, .16);
  --on-accent: #ffffff;
  --win: #1d8656;
  --black-piece: #1b1f22;
  --black-edge: #000;
  --white-piece: #fbfbf7;
  --white-edge: #8c938b;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111413; --ink: #e6eae5; --line: #2d3430; --surface: #1c211f; --muted: #8f9890;
    --sq-light: #586257; --sq-dark: #3a423b; --accent: #7d9bff; --accent-soft: rgba(125, 155, 255, .22);
    --on-accent: #0c1433; --win: #4cc48c; --black-piece: #0b0d0e; --black-edge: #000;
    --white-piece: #eef0ea; --white-edge: #9aa298; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); }
.stage { --size: min(92vw, calc(100vh - 190px), 640px); min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
.board { width: var(--size); height: var(--size); display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 12px 34px -18px rgba(0, 0, 0, .55); transition: box-shadow .3s; }
.board.thinking { box-shadow: 0 0 0 2px var(--accent), 0 12px 34px -18px rgba(0, 0, 0, .55); }
@media (prefers-reduced-motion: no-preference) { .board.thinking { animation: think 1.4s ease-in-out infinite; } }
@keyframes think { 50% { box-shadow: 0 0 0 2px transparent, 0 12px 34px -18px rgba(0, 0, 0, .55); } }
.sq { position: relative; border: 0; padding: 0; margin: 0; background: var(--sq-light); cursor: pointer; display: grid; place-items: center; }
.sq.dk { background: var(--sq-dark); }
.sq:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 2; }
.sq.last::after { content: ""; position: absolute; inset: 0; background: var(--accent-soft); pointer-events: none; }
.sq.sel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--accent); pointer-events: none; }
.piece { width: 76%; height: 76%; border-radius: 50%; pointer-events: none; position: relative; z-index: 1; transition: opacity .3s; }
.piece.b { background: radial-gradient(circle at 35% 30%, #4a5157 0%, var(--black-piece) 62%); box-shadow: 0 0 0 1px var(--black-edge), 0 3px 6px -2px rgba(0, 0, 0, .6); }
.piece.w { background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--white-piece) 60%, #d9ddd5 100%); box-shadow: 0 0 0 1px var(--white-edge), 0 3px 6px -2px rgba(0, 0, 0, .45); }
.sq.won .piece { box-shadow: 0 0 0 3px var(--win), 0 0 16px 3px var(--win); }
.board.drawn .piece { opacity: .45; }
.dot { width: 26%; height: 26%; border-radius: 50%; background: var(--accent); opacity: .75; pointer-events: none; }
.ring { position: absolute; inset: 7%; border-radius: 50%; border: 3px solid var(--accent); pointer-events: none; z-index: 2; }
@media (prefers-reduced-motion: no-preference) { .piece.moving { transition: transform .22s cubic-bezier(.2, .7, .2, 1); } }
.say { width: var(--size); max-width: 100%; min-height: 58px; display: flex; align-items: flex-end; }
.bubble { position: relative; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; font-size: 15px; font-weight: 500; line-height: 1.45; box-shadow: 0 6px 18px -12px rgba(0, 0, 0, .5); }
.bubble::after { content: ""; position: absolute; left: 24px; bottom: -7px; width: 12px; height: 12px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.bubble .who { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 8px; letter-spacing: .04em; }
@media (prefers-reduced-motion: no-preference) {
  .bubble.pop { animation: pop .28s cubic-bezier(.2, .9, .3, 1.3); }
}
@keyframes pop { from { transform: translateY(6px) scale(.96); opacity: .3; } }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 48px; }
.btn { font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; padding: 12px 22px; background: var(--accent); color: var(--on-accent); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { filter: brightness(1.1); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn .chip { width: 14px; height: 14px; border-radius: 50%; }
.chip.b { background: var(--black-piece); box-shadow: 0 0 0 1px var(--on-accent); }
.chip.w { background: var(--white-piece); box-shadow: 0 0 0 1px var(--white-edge); }
</style>
</head>
<body>
<main class="stage">
  <div class="say" aria-live="polite"><div class="bubble" id="bubble"><span class="who">튀르크</span><span id="say-text"></span></div></div>
  <div class="board" id="board" role="grid" aria-label="LOA 판"></div>
  <div class="controls">
    <div class="controls" id="pick">
      <button type="button" class="btn" id="pick-1"><span class="chip b"></span>흑 · 선공</button>
      <button type="button" class="btn" id="pick-2"><span class="chip w"></span>백 · 후공</button>
    </div>
    <button type="button" class="btn" id="btn-new" hidden>새 게임</button>
  </div>
</main>

<script>
/* =====================================================================
   LOA (Lines of Action) engine
   Rules (MSO / Computer Olympiad set, as on Winands' rules page):
     - 8x8, black on top+bottom rows, white on left+right columns, black moves first
     - move along a line exactly as many squares as there are pieces on that line
     - may jump own pieces, may not jump enemy pieces, capture by landing
     - connect all own pieces (8-neighbourhood) to win; single piece = connected
     - a move that connects both sides at once = draw
     - no legal move = pass
     - same position with same side to move a 3rd time = draw
   ===================================================================== */
function LoaEngine(opts) {
  "use strict";
  opts = opts || {};
  const WIN = 30000, MATE_BOUND = 29000, INF = 32000, MAXPLY = 128;
  const NF = 24; // features per side

  /* ---------------- geometry ---------------- */
  const DR = [0, 0, 1, -1, 1, -1, 1, -1], DC = [1, -1, 0, 0, 1, -1, -1, 1];
  const LINES = new Int8Array(256);
  for (let s = 0; s < 64; s++) {
    const r = s >> 3, c = s & 7;
    LINES[s * 4] = r; LINES[s * 4 + 1] = 8 + c;
    LINES[s * 4 + 2] = 16 + (r - c + 7); LINES[s * 4 + 3] = 31 + (r + c);
  }
  const RAY = new Int8Array(64 * 8 * 8).fill(-1), RLEN = new Int8Array(512);
  for (let s = 0; s < 64; s++) for (let d = 0; d < 8; d++) {
    let r = s >> 3, c = s & 7, k = 0;
    for (;;) {
      r += DR[d]; c += DC[d];
      if (r < 0 || r > 7 || c < 0 || c > 7) break;
      RAY[(s * 8 + d) * 8 + k] = r * 8 + c; k++;
    }
    RLEN[s * 8 + d] = k;
  }
  const NBS = new Int16Array(65), NB = new Int8Array(64 * 8);
  { let k = 0;
    for (let s = 0; s < 64; s++) {
      NBS[s] = k;
      const r = s >> 3, c = s & 7;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < 8 && cc >= 0 && cc < 8) NB[k++] = rr * 8 + cc;
      }
    }
    NBS[64] = k; }
  // square classes (8-fold symmetry) for the piece-square table
  const CLS = new Int8Array(64), RING = new Int8Array(64);
  { const map = {};
    const order = ["0,0", "0,1", "0,2", "0,3", "1,1", "1,2", "1,3", "2,2", "2,3", "3,3"];
    order.forEach((k, i) => (map[k] = i));
    for (let s = 0; s < 64; s++) {
      const r = s >> 3, c = s & 7;
      let a = Math.min(r, 7 - r), b = Math.min(c, 7 - c);
      if (a > b) { const t = a; a = b; b = t; }
      CLS[s] = map[a + "," + b]; RING[s] = a;
    } }
  const MINSUM = new Int16Array(16);
  for (let n = 0; n < 16; n++) MINSUM[n] = n <= 1 ? 0 : n <= 9 ? n - 1 : 8 + 2 * (n - 9);
  const CHEB = new Int8Array(64 * 64);
  for (let a = 0; a < 64; a++) for (let b = 0; b < 64; b++)
    CHEB[a * 64 + b] = Math.max(Math.abs((a >> 3) - (b >> 3)), Math.abs((a & 7) - (b & 7)));

  /* ---------------- zobrist ---------------- */
  let seed = 0x9e3779b9 | 0;
  const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; };
  const Z1 = new Int32Array(192), Z2 = new Int32Array(192);
  for (let i = 0; i < 192; i++) { Z1[i] = rnd(); Z2[i] = rnd(); }
  const ZS1 = rnd(), ZS2 = rnd();

  /* ---------------- state ---------------- */
  const board = new Int8Array(64);
  const plist = [null, new Int8Array(16), new Int8Array(16)];
  const pcount = new Int8Array(3);
  const pidx = new Int8Array(64);
  const lineCnt = new Int8Array(46);
  let stm = 1, h1 = 0, h2 = 0, posId = 1;
  const HMAX = 4096;
  const HIST1 = new Int32Array(HMAX), HIST2 = new Int32Array(HMAX), HREV = new Int16Array(HMAX);
  let hp = 0;

  function clearBoard() {
    board.fill(0); pcount.fill(0); lineCnt.fill(0); h1 = 0; h2 = 0;
  }
  function addPiece(s, p) {
    board[s] = p; pidx[s] = pcount[p]; plist[p][pcount[p]++] = s;
    for (let a = 0; a < 4; a++) lineCnt[LINES[s * 4 + a]]++;
    h1 ^= Z1[p * 64 + s]; h2 ^= Z2[p * 64 + s];
  }
  function setPosition(arr, side) {
    clearBoard(); posId++;
    for (let s = 0; s < 64; s++) if (arr[s]) addPiece(s, arr[s]);
    stm = side;
    if (side === 2) { h1 ^= ZS1; h2 ^= ZS2; }
    hp = 0; HIST1[0] = h1; HIST2[0] = h2; HREV[0] = 0;
  }
  function startArray() {
    const b = new Int8Array(64);
    for (let c = 1; c <= 6; c++) { b[c] = 1; b[56 + c] = 1; }
    for (let r = 1; r <= 6; r++) { b[r * 8] = 2; b[r * 8 + 7] = 2; }
    return b;
  }

  // move encoding: from | to<<6 | capture<<12 ; PASS = 8191 is not used as a board move
  const PASS = 8191;
  function make(m) {
    const f = m & 63, t = (m >> 6) & 63, p = board[f], o = 3 - p;
    if (m & 4096) {
      const i = pidx[t], last = plist[o][--pcount[o]];
      plist[o][i] = last; pidx[last] = i;
      h1 ^= Z1[o * 64 + t]; h2 ^= Z2[o * 64 + t];
    } else {
      lineCnt[LINES[t * 4]]++; lineCnt[LINES[t * 4 + 1]]++; lineCnt[LINES[t * 4 + 2]]++; lineCnt[LINES[t * 4 + 3]]++;
    }
    lineCnt[LINES[f * 4]]--; lineCnt[LINES[f * 4 + 1]]--; lineCnt[LINES[f * 4 + 2]]--; lineCnt[LINES[f * 4 + 3]]--;
    board[f] = 0; board[t] = p;
    const i = pidx[f]; plist[p][i] = t; pidx[t] = i;
    h1 ^= Z1[p * 64 + f] ^ Z1[p * 64 + t] ^ ZS1;
    h2 ^= Z2[p * 64 + f] ^ Z2[p * 64 + t] ^ ZS2;
    stm = o; posId++;
    hp++; HIST1[hp] = h1; HIST2[hp] = h2; HREV[hp] = (m & 4096) ? hp : HREV[hp - 1];
  }
  function unmake(m) {
    hp--;
    const f = m & 63, t = (m >> 6) & 63, p = board[t], o = 3 - p;
    board[f] = p;
    const i = pidx[t]; plist[p][i] = f; pidx[f] = i;
    lineCnt[LINES[f * 4]]++; lineCnt[LINES[f * 4 + 1]]++; lineCnt[LINES[f * 4 + 2]]++; lineCnt[LINES[f * 4 + 3]]++;
    if (m & 4096) {
      board[t] = o; pidx[t] = pcount[o]; plist[o][pcount[o]++] = t;
      h1 ^= Z1[o * 64 + t]; h2 ^= Z2[o * 64 + t];
    } else {
      board[t] = 0;
      lineCnt[LINES[t * 4]]--; lineCnt[LINES[t * 4 + 1]]--; lineCnt[LINES[t * 4 + 2]]--; lineCnt[LINES[t * 4 + 3]]--;
    }
    h1 ^= Z1[p * 64 + f] ^ Z1[p * 64 + t] ^ ZS1;
    h2 ^= Z2[p * 64 + f] ^ Z2[p * 64 + t] ^ ZS2;
    stm = p; posId++;
  }
  function makePass() {
    h1 ^= ZS1; h2 ^= ZS2; stm = 3 - stm;
    hp++; HIST1[hp] = h1; HIST2[hp] = h2; HREV[hp] = hp;
  }
  function unmakePass() { hp--; h1 ^= ZS1; h2 ^= ZS2; stm = 3 - stm; }

  function genMoves(side, out, n0) {
    let n = n0;
    const opp = 3 - side, pl = plist[side], cnt = pcount[side];
    for (let i = 0; i < cnt; i++) {
      const s = pl[i], s4 = s * 4, s8 = s * 8;
      for (let a = 0; a < 4; a++) {
        const k = lineCnt[LINES[s4 + a]];
        for (let d = 2 * a; d < 2 * a + 2; d++) {
          if (k > RLEN[s8 + d]) continue;
          const base = (s8 + d) * 8, t = RAY[base + k - 1], bt = board[t];
          if (bt === side) continue;
          let ok = true;
          for (let j = 0; j < k - 1; j++) if (board[RAY[base + j]] === opp) { ok = false; break; }
          if (ok) out[n++] = s | (t << 6) | (bt ? 4096 : 0);
        }
      }
    }
    return n;
  }

  /* ---------------- connectivity ---------------- */
  const STAMP = new Int32Array(64); let stampId = 1;
  const STK = new Int8Array(64);
  const LAB = new Int8Array(64), GSIZE = new Int8Array(48), LABTAG = new Int32Array(3), LABG = new Int8Array(3);
  function bump() { if (++stampId > 2000000000) { STAMP.fill(0); stampId = 1; } return stampId; }
  function connected(side) {
    const n = pcount[side];
    if (n <= 1) return true;
    const st = bump(), pl = plist[side];
    let sp = 0, seen = 1;
    STK[sp++] = pl[0]; STAMP[pl[0]] = st;
    while (sp) {
      const x = STK[--sp];
      for (let j = NBS[x], e = NBS[x + 1]; j < e; j++) {
        const y = NB[j];
        if (board[y] === side && STAMP[y] !== st) {
          STAMP[y] = st; STK[sp++] = y;
          if (++seen === n) return true;
        }
      }
    }
    return false;
  }
  // labels groups of side into LAB / GSIZE, returns group count
  function label(side) {
    if (LABTAG[side] === posId) return LABG[side];
    const n = pcount[side], pl = plist[side], st = bump(), gb = side * 16;
    let g = 0;
    for (let i = 0; i < n; i++) {
      const s0 = pl[i];
      if (STAMP[s0] === st) continue;
      let sp = 0, size = 1;
      STK[sp++] = s0; STAMP[s0] = st; LAB[s0] = g;
      while (sp) {
        const x = STK[--sp];
        for (let j = NBS[x], e = NBS[x + 1]; j < e; j++) {
          const y = NB[j];
          if (board[y] === side && STAMP[y] !== st) { STAMP[y] = st; LAB[y] = g; STK[sp++] = y; size++; }
        }
      }
      GSIZE[gb + g++] = size;
    }
    LABTAG[side] = posId; LABG[side] = g;
    return g;
  }
  // result after a move made by `mover`: 1 mover wins, -1 mover loses, 2 draw, 0 nothing
  function resultAfter(mover, wasCapture) {
    const me = connected(mover);
    const op = wasCapture ? connected(3 - mover) : false;
    if (me && op) return 2;
    if (me) return 1;
    if (op) return -1;
    return 0;
  }
  // can `side` win with one move right now (as if it were side's turn)?
  // Filter: the landing square must touch every group except (possibly) the mover's own singleton group.
  const ADJ = new Int32Array(64), ADJS = new Int32Array(64), GOOD = new Int32Array(64);
  let adjStamp = 0;
  function canWinNow(side) {
    const n = pcount[side];
    if (n <= 1) return true;
    const g = label(side);
    if (g === 1) return true;
    if (g > 5) return false;
    const full = (1 << g) - 1, gb = side * 16, pl = plist[side];
    const st = ++adjStamp;
    // OR of neighbouring group bits for every square
    for (let i = 0; i < n; i++) {
      const s = pl[i], bit = 1 << LAB[s];
      for (let j = NBS[s], e = NBS[s + 1]; j < e; j++) {
        const t = NB[j];
        if (ADJS[t] !== st) { ADJS[t] = st; ADJ[t] = bit; } else ADJ[t] |= bit;
      }
    }
    // singleton groups mask
    let single = 0;
    for (let k = 0; k < g; k++) if (GSIZE[gb + k] === 1) single |= 1 << k;
    // landing squares that could work for some mover
    let any = false;
    for (let i = 0; i < n; i++) {
      const s = pl[i];
      for (let j = NBS[s], e = NBS[s + 1]; j < e; j++) {
        const t = NB[j];
        if (board[t] === side || GOOD[t] === st) continue;
        const m = ADJ[t], miss = full & ~m;
        if (miss === 0 || ((miss & (miss - 1)) === 0 && (miss & single))) { GOOD[t] = st; any = true; }
      }
    }
    if (!any) return false;
    const opp = 3 - side;
    for (let i = 0; i < n; i++) {
      const f = pl[i], f4 = f * 4, f8 = f * 8;
      for (let a = 0; a < 4; a++) {
        const k = lineCnt[LINES[f4 + a]];
        for (let d = 2 * a; d < 2 * a + 2; d++) {
          if (k > RLEN[f8 + d]) continue;
          const base = (f8 + d) * 8, t = RAY[base + k - 1];
          if (GOOD[t] !== st) continue;
          const bt = board[t];
          if (bt === side) continue;
          // exact neighbour test without the mover
          const need = GSIZE[gb + LAB[f]] === 1 ? full & ~(1 << LAB[f]) : full;
          let mask = 0;
          for (let j = NBS[t], e = NBS[t + 1]; j < e; j++) {
            const y = NB[j];
            if (y !== f && board[y] === side) mask |= 1 << LAB[y];
          }
          if ((mask & need) !== need) continue;
          let ok = true;
          for (let j = 0; j < k - 1; j++) if (board[RAY[base + j]] === opp) { ok = false; break; }
          if (!ok) continue;
          const m = f | (t << 6) | (bt ? 4096 : 0);
          const saveStm = stm, savePos = posId;
          make(m);
          const r = resultAfter(side, bt !== 0);
          unmake(m);
          stm = saveStm;
          // same position again: keep the cached labels valid
          if (LABTAG[1] === savePos) LABTAG[1] = posId;
          if (LABTAG[2] === savePos) LABTAG[2] = posId;
          if (r === 1) return true;
        }
      }
    }
    return false;
  }

  /* ---------------- evaluation ---------------- */
  const QW = new Int8Array(81), QS = new Int32Array(81);
  const MBUF = new Int32Array(256);
  let useMobility = true;
  // writes NF raw features for `side` into F at offset off
  function features(side, F, off) {
    for (let i = 0; i < NF; i++) F[off + i] = 0;
    const n = pcount[side], pl = plist[side];
    if (n === 0) return;
    let sr = 0, sc = 0, minR = 9, maxR = -1, minC = 9, maxC = -1;
    for (let i = 0; i < n; i++) {
      const s = pl[i], r = s >> 3, c = s & 7;
      sr += r; sc += c;
      if (r < minR) minR = r; if (r > maxR) maxR = r;
      if (c < minC) minC = c; if (c > maxC) maxC = c;
      F[off + CLS[s]] += 1;
    }
    const comR = Math.round(sr / n), comC = Math.round(sc / n), com = comR * 8 + comC;
    let sum = 0, mx = 0, far = 0;
    for (let i = 0; i < n; i++) {
      const dd = CHEB[pl[i] * 64 + com];
      sum += dd; if (dd > mx) mx = dd; if (dd >= 3) far++;
    }
    const conc = sum - MINSUM[n];
    F[off + 22] = mx; F[off + 23] = far;
    F[off + 10] = conc;
    F[off + 11] = conc / n;
    const g = label(side);
    F[off + 12] = g - 1;
    F[off + 21] = (g - 1) * (g - 1);
    // neighbours, isolated, quads
    let iso = 0, conn = 0, quads = 0;
    const st = bump();
    for (let i = 0; i < n; i++) {
      const s = pl[i], r = s >> 3, c = s & 7;
      let nb = 0;
      for (let j = NBS[s], e = NBS[s + 1]; j < e; j++) if (board[NB[j]] === side) nb++;
      conn += nb; if (!nb) iso++;
      // windows with top-left (r-1..r, c-1..c), index (wr+1)*9+(wc+1)
      const w0 = r * 9 + c; // window (r-1,c-1)
      for (let q = 0; q < 4; q++) {
        const w = w0 + (q & 1) + (q >> 1) * 9;
        if (QS[w] !== st) { QS[w] = st; QW[w] = 0; }
        if (++QW[w] === 3) quads++;
      }
    }
    F[off + 13] = iso;

function humanTalk(m, elapsed) {
  clearTimeout(slowTimer); clearTimeout(chatTimer);
  if (state.over) { endTalk(); return; }
  if (m === PASS) say("humanPass");
  else if (m & 4096) say("humanCap");
  else if (!humanNearSaid && R._label(human) === 2) { humanNearSaid = true; say("humanNear"); }
  else if (elapsed < 1500 && Math.random() < 0.3) say("fast");
  else if (!longSaid && moves.length >= 60) { longSaid = true; say("longGame"); }
}
function armSlowTimer() {
  clearTimeout(slowTimer); clearTimeout(chatTimer);
  turnStart = Date.now();
  clearTimeout(chatTimer);
  const ply = moves.length, g = gameId;
  const still = () => g === gameId && moves.length === ply && started && !state.over && state.stm === human;
  chatTimer = setTimeout(() => { if (still() && Math.random() < 0.6) chat(); }, 15000);
  slowTimer = setTimeout(() => { if (still()) say("slow"); }, 40000);
}

function replay() {
  R.setStart();
  const counts = new Map(), key = () => R.hash.join(",");
  counts.set(key(), 1);
  let over = false, winner = 0, passes = 0;
  for (const m of moves) {
    const side = R.stm;
    R.play(m);
    if (m === PASS) { if (++passes >= 2) { over = true; break; } }
    else {
      passes = 0;
      const r = R.resultAfter(side, (m & 4096) !== 0);
      if (r === 1) { over = true; winner = side; break; }
      if (r === -1) { over = true; winner = 3 - side; break; }
      if (r === 2) { over = true; break; }
    }
    const k = key(), c = (counts.get(k) || 0) + 1; counts.set(k, c);
    if (c >= 3) { over = true; break; }
  }
  const b = Array.from(R.board);
  const won = [];
  if (winner) for (let s = 0; s < 64; s++) if (b[s] === winner) won.push(s);
  return { b, stm: R.stm, over, winner, won, legal: over ? [] : R.legalMoves(), last: moves.length ? moves[moves.length - 1] : -1 };
}

/* ---------------- engine in a background worker ---------------- */
const WORKER_SRC = LoaEngine.toString() + `
const E = LoaEngine({ ttBits: 20 });
E.setWeights(${JSON.stringify(TUNED_WEIGHTS)});
onmessage = function (e) {
  const d = e.data;
  E.setStart();
  for (const m of d.moves) E.play(m);
  postMessage({ id: d.id, info: E.think({ time: d.time, keepHistory: true }) });
};`;
let worker = null, workerBroken = false, busy = null, reqId = 0, localE = null;
function getWorker() {
  if (worker || workerBroken) return worker;
  try {
    worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })));
    worker.onmessage = (e) => done(e.data);
    worker.onerror = () => { worker = null; workerBroken = true; if (busy) runLocal(busy); };
  } catch (e) { worker = null; workerBroken = true; }
  return worker;
}
function send(req) {
  busy = req;
  const w = getWorker();
  if (w) w.postMessage({ id: req.id, moves: req.moves, time: req.time });
  else runLocal(req);
}
function runLocal(req) { // no worker available: think on the page itself (the page pauses meanwhile)
  if (!localE) { localE = LoaEngine({ ttBits: 18 }); localE.setWeights(TUNED_WEIGHTS); }
  setTimeout(() => {
    localE.setStart(); for (const m of req.moves) localE.play(m);
    done({ id: req.id, info: localE.think({ time: req.time, keepHistory: true }) });
  }, 30);
}
function done(d) {
  if (!busy || d.id !== busy.id) return;
  const req = busy; busy = null;
  if (req.game === gameId && !req.ponder && !state.over && state.stm !== human) {
    let m = d.info.move;
    if (m !== PASS && !state.legal.includes(m)) m = state.legal[0];
    commit(m);
    engineTalk(m, d.info);
    return;
  }
  next();
}

/* ---------------- flow ---------------- */
function next() {
  if (!started || busy || state.over) return;            // a ponder slice calls next() again when it ends
  if (!state.legal.length) {                               // no legal move: pass
    const engineSide = state.stm !== human;
    commit(PASS);
    if (engineSide) engineTalk(PASS, { score: 0, depth: 0, nodes: 0 }); else humanTalk(PASS);
    return;
  }
  if (state.stm !== human) send({ id: ++reqId, game: gameId, moves: moves.slice(), time: THINK_MS, ponder: false });
  else if (!workerBroken) send({ id: ++reqId, game: gameId, moves: moves.slice(), time: PONDER_MS, ponder: true });
  render();
}
function commit(m) {
  moves.push(m); sel = -1;
  state = replay();
  render(m === PASS ? -1 : m & 63, m === PASS ? -1 : (m >> 6) & 63);
  next();
  if (started && !state.over && state.stm === human) armSlowTimer();
}
// "새 게임": stop, reset the board, and ask for a side again
function newGame() {
  gameId++;
  if (busy && !busy.ponder && worker) { worker.terminate(); worker = null; busy = null; } // don't wait out a 5 s think
  started = false; moves = []; sel = -1;
  clearTimeout(slowTimer); clearTimeout(chatTimer); clearTimeout(winTimer);
  state = replay();
  say("pick");
  document.getElementById("pick").hidden = false;
  document.getElementById("btn-new").hidden = true;
  render();
  document.getElementById("pick-1").focus();
}
function start(side) {
  gameId++;
  human = side; started = true; moves = []; sel = -1;
  prevP = null; mateSaid = leadSaid = doomSaid = false;
  humanNearSaid = engineNearSaid = longSaid = false;
  clearTimeout(winTimer);
  state = replay();
  if (games > 0 && streak >= 2 && Math.random() < 0.7) say("streak", { k: streak });
  else if (games > 0 && Math.random() < 0.6) say("rematch", { w: turkWins, l: humanWins });
  else say(side === 1 ? "startHumanBlack" : "startEngineBlack");
  if (side === 1) armSlowTimer();
  document.getElementById("pick").hidden = true;
  document.getElementById("btn-new").hidden = false;
  boardEl.setAttribute("aria-label", "LOA 판, 나는 " + (side === 1 ? "흑" : "백"));
  render();
  next();
}
function onSquare(s) {
  if (!started || state.over || state.stm !== human) return;
  if (sel >= 0) {
    const m = state.legal.find((x) => (x & 63) === sel && ((x >> 6) & 63) === s);
    if (m !== undefined) { const el = Date.now() - turnStart; commit(m); humanTalk(m, el); return; }
    sel = state.b[s] === human && state.legal.some((x) => (x & 63) === s) ? s : -1;
    render(); return;
  }
  if (state.b[s] === human && state.legal.some((x) => (x & 63) === s)) { sel = s; render(); }
}

/* ---------------- drawing ---------------- */
const boardEl = document.getElementById("board"), sqEls = [];
for (let s = 0; s < 64; s++) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "sq" + (((s >> 3) + (s & 7)) % 2 ? " dk" : "");
  el.id = "sq-" + sqName(s);
  el.addEventListener("click", () => onSquare(s));
  boardEl.appendChild(el); sqEls.push(el);
}
function render(animFrom, animTo) {
  const st = state;
  const targets = new Map();
  if (sel >= 0) for (const m of st.legal) if ((m & 63) === sel) targets.set((m >> 6) & 63, (m & 4096) !== 0);
  const real = st.last >= 0 && st.last !== PASS;
  const lf = real ? st.last & 63 : -1, lt = real ? (st.last >> 6) & 63 : -1;
  for (let s = 0; s < 64; s++) {
    const el = sqEls[s], p = st.b[s];
    el.classList.toggle("last", s === lf || s === lt);
    el.classList.toggle("sel", s === sel);
    el.classList.toggle("won", st.won.includes(s));
    let h = p ? `<span class="piece ${p === 1 ? "b" : "w"}"></span>` : "";
    if (targets.has(s)) h += targets.get(s) ? `<span class="ring"></span>` : `<span class="dot"></span>`;
    if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
    el.setAttribute("aria-label", sqName(s) + (p ? (p === 1 ? " 흑" : " 백") : " 빈칸") + (targets.has(s) ? ", 여기로 이동 가능" : ""));
  }
  boardEl.classList.toggle("thinking", started && !st.over && st.stm !== human);
  boardEl.classList.toggle("drawn", st.over && !st.winner);
  if (animFrom >= 0 && animTo >= 0 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const pc = sqEls[animTo].querySelector(".piece");
    if (pc) {
      const a = sqEls[animFrom].getBoundingClientRect(), b = sqEls[animTo].getBoundingClientRect();
      pc.style.transform = `translate(${a.left - b.left}px, ${a.top - b.top}px)`;
      pc.getBoundingClientRect();
      pc.classList.add("moving");
      pc.style.transform = "";
    }
  }
}

document.getElementById("btn-new").addEventListener("click", newGame);
document.getElementById("pick-1").addEventListener("click", () => start(1));
document.getElementById("pick-2").addEventListener("click", () => start(2));
state = replay();
render();
say("pick");
</script>
</body>
</html>
